        shame, or scandal in one's past or family history that is kept hidden from
        others. The phrase is often used figuratively to refer to a dark secret that,
        if revealed, would have a negative impact on someone's reputation or life.\\n\\n**Origin:**\\n\\nThe
        phrase originated in the 18th century, when people kept their dead loved ones'
        skeletons in cupboards (closets) as mementos or for medical purposes. Over
        time, the phrase evolved to refer to secrets that were hidden away, much like
