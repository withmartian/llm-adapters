        and returning.\n\nWe''ll use a class `Library` to encapsulate the logic and
        store the books in a dictionary for easy access by ISBN.\n\n```python\nimport
        time # Optional: To add slight pauses for better readability\n\nclass Library:\n    \"\"\"\n    A
