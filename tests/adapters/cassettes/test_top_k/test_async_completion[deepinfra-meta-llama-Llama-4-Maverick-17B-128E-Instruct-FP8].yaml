        Servi\xE7os Personalizados\\nRev. bras. med. trab.\_vol.25\_no.1\_Belo Horizonte\_jan./mar.\_2024
        \_Epub\_14-Mar-2024\\nhttps://doi.org/10.47626/1679-4435-2023-0013\_ \\nBenign
        prostatic hyperplasia: literature review\\nHiperplasia prost\xE1tica benigna:
        revisi\xF3n de la literatura\\nGustavo Henrique\_Corr\xEAa1\_ \\nJuliana\_Barbosa1\_
        \\n1Universidade Federal de Minas Gerais, Belo Horizonte, MG, Brasil\\nA hiperplasia
        prost\xE1tica benigna (HPB) \xE9 uma doen\xE7a comum em homens com mais de
        50 anos e est\xE1 relacionada a sintomas urin\xE1rios do trato inferior (STUI).
        A doen\xE7a tem alta preval\xEAncia e \xE9 respons\xE1vel por reduzir a qualidade
        de vida dos pacientes acometidos. O objetivo deste trabalho foi realizar uma
        revis\xE3o da literatura sobre a HPB, abordando sua epidemiologia, fisiopatologia,
        diagn\xF3stico e tratamento. Foi realizada uma revis\xE3o narrativa da literatura,
        com busca nas bases de dados PubMed e SciELO. Os artigos foram selecionados
        com base nos crit\xE9rios de inclus\xE3o e exclus\xE3o estabelecidos. A HPB
        \xE9 uma doen\xE7a multifatorial, com fatores de risco como idade, ra\xE7a,
        hist\xF3ria familiar e estilo de vida. O diagn\xF3stico \xE9 baseado em sintomas,
        exame f\xEDsico e exames complementares, como ultrassonografia e bi\xF3psia.
        O tratamento pode ser conservador ou cir\xFArgico, dependendo da gravidade
        dos sintomas e do impacto na qualidade de vida do paciente. A HPB \xE9 uma
        doen\xE7a comum e importante, que afeta a qualidade de vida de muitos homens.
        O diagn\xF3stico e o tratamento adequados s\xE3o fundamentais para melhorar
        a qualidade de vida dos pacientes acometidos.\\nPalavras-chave:\_hiperplasia
        prost\xE1tica benigna; sintomas do trato urin\xE1rio inferior; tratamento;
        diagn\xF3stico\\nBenign prostatic hyperplasia (BPH) is a common disease in
        men over 50 years old and is related to lower urinary tract symptoms (LUTS).
        The disease has a high prevalence and is responsible for reducing the quality
        of life of affected patients. The objective of this study was to conduct a
        literature review on BPH, addressing its epidemiology, pathophysiology, diagnosis,
        and treatment. A narrative literature review was performed, searching the
        PubMed and SciELO databases. Articles were selected based on established inclusion
        and exclusion criteria. BPH is a multifactorial disease, with risk factors
        such as age, race, family history, and lifestyle. Diagnosis is based on symptoms,
        physical examination, and complementary tests such as ultrasound and biopsy.
        Treatment can be conservative or surgical, depending on the severity of symptoms
        and their impact on the patient's quality of life. BPH is a common and significant
        disease that affects the quality of life of many men. Proper diagnosis and
        treatment are essential to improve the quality of life of affected patients.\\nKeywords:\_benign
        prostatic hyperplasia; lower urinary tract symptoms; treatment; diagnosis\\nLa
        hiperplasia prost\xE1tica benigna (HPB) es una enfermedad com\xFAn en hombres
        mayores de 50 a\xF1os y est\xE1 relacionada con s\xEDntomas urinarios del
        tracto inferior (STUI). La enfermedad tiene una alta prevalencia y es responsable
        de reducir la calidad de vida de los pacientes afectados. El objetivo de este
        trabajo fue realizar una revisi\xF3n de la literatura sobre la HPB, abordando
        su epidemiolog\xEDa, fisiopatolog\xEDa, diagn\xF3stico y tratamiento. Se realiz\xF3
        una revisi\xF3n narrativa de la literatura, con b\xFAsqueda en las bases de
        datos PubMed y SciELO. Los art\xEDculos fueron seleccionados con base en los
        criterios de inclusi\xF3n y exclusi\xF3n establecidos. La HPB es una enfermedad
        multifactorial, con factores de riesgo como edad, raza, historia familiar
        y estilo de vida. El diagn\xF3stico se basa en s\xEDntomas, examen f\xEDsico
        y ex\xE1menes complementarios, como ultrasonido y biopsia. El tratamiento
        puede ser conservador o quir\xFArgico, dependiendo de la gravedad de los s\xEDntomas
        y del impacto en la calidad de vida del paciente. La HPB es una enfermedad
        com\xFAn e importante, que afecta la calidad de vida de muchos hombres. El
        diagn\xF3stico y el tratamiento adecuados son fundamentales para mejorar la
        calidad de vida de los pacientes afectados.\\nPalabras clave:\_hiperplasia
        prost\xE1tica benigna; s\xEDntomas del tracto urinario inferior; tratamiento;
        diagn\xF3stico\\nA hiperplasia prost\xE1tica benigna (HPB) \xE9 uma doen\xE7a
        comum em homens com mais de 50 anos e est\xE1 relacionada a sintomas urin\xE1rios
        do trato inferior (STUI).1 A doen\xE7a \xE9 caracterizada por um aumento no
        tamanho da pr\xF3stata, o que pode levar a obstru\xE7\xE3o urin\xE1ria e STUI.2
        \\nA HPB \xE9 uma doen\xE7a multifatorial, com fatores de risco como idade,
        ra\xE7a, hist\xF3ria familiar e estilo de vida.3 A idade \xE9 o principal
        fator de risco, com a preval\xEAncia da doen\xE7a aumentando significativamente
        ap\xF3s os 50 anos.4 A ra\xE7a tamb\xE9m \xE9 um fator de risco, com homens
        afro-americanos tendo uma maior preval\xEAncia da doen\xE7a do que homens
        caucasianos.5 \\nO diagn\xF3stico da HPB \xE9 baseado em sintomas, exame f\xEDsico
        e exames complementares, como ultrassonografia e bi\xF3psia.6 Os sintomas
        mais comuns incluem dificuldade para iniciar a mic\xE7\xE3o, fluxo urin\xE1rio
        fraco, sensa\xE7\xE3o de esvaziamento incompleto da bexiga e frequ\xEAncia
        urin\xE1ria aumentada.7 \\nO tratamento da HPB pode ser conservador ou cir\xFArgico,
        dependendo da gravidade dos sintomas e do impacto na qualidade de vida do
        paciente.8 O tratamento conservador inclui mudan\xE7as no estilo de vida,
        como perda de peso e exerc\xEDcios f\xEDsicos, e medicamentos, como alfa-bloqueadores
        e inibidores da 5-alfa-reductase.9 O tratamento cir\xFArgico inclui procedimentos
        como a ressec\xE7\xE3o transuretral da pr\xF3stata (RTUP) e a prostatectomia
        aberta.10 \\nO objetivo deste trabalho foi realizar uma revis\xE3o da literatura
        sobre a HPB, abordando sua epidemiologia, fisiopatologia, diagn\xF3stico e
        tratamento.\\nFoi realizada uma revis\xE3o narrativa da literatura, com busca
        nas bases de dados PubMed e SciELO. Os artigos foram selecionados com base
        nos crit\xE9rios de inclus\xE3o e exclus\xE3o estabelecidos. Os crit\xE9rios
        de inclus\xE3o foram: artigos publicados em ingl\xEAs ou portugu\xEAs, estudos
        realizados em humanos, artigos que abordassem a epidemiologia, fisiopatologia,
        diagn\xF3stico e tratamento da HPB. Os crit\xE9rios de exclus\xE3o foram:
        artigos que n\xE3o abordassem a HPB, estudos realizados em animais, artigos
        que n\xE3o estivessem dispon\xEDveis em texto completo.\\nA busca foi realizada
        utilizando os seguintes termos: \u201Chiperplasia prost\xE1tica benigna\u201D,
        \u201Csintomas do trato urin\xE1rio inferior\u201D, \u201Ctratamento\u201D,
        \u201Cdiagn\xF3stico\u201D. Foram inclu\xEDdos artigos publicados nos \xFAltimos
        10 anos. A sele\xE7\xE3o dos artigos foi realizada por dois revisores independentes,
        que avaliaram os t\xEDtulos e resumos dos artigos identificados na busca.
        Os artigos que atenderam aos crit\xE9rios de inclus\xE3o foram lidos na \xEDntegra
        e inclu\xEDdos na revis\xE3o.\\nA HPB \xE9 uma doen\xE7a comum em homens com
        mais de 50 anos, caracterizada por um aumento no tamanho da pr\xF3stata, o
        que pode levar a obstru\xE7\xE3o urin\xE1ria e STUI.11 A doen\xE7a \xE9 multifatorial,
        com fatores de risco como idade, ra\xE7a, hist\xF3ria familiar e estilo de
        vida.12 \\nA idade \xE9 o principal fator de risco, com a preval\xEAncia da
        doen\xE7a aumentando significativamente ap\xF3s os 50 anos.13 Estudos mostram
        que a preval\xEAncia da HPB aumenta de 3,7% em homens com 45-49 anos para
        42,8% em homens com 75-79 anos.14 \\nA ra\xE7a tamb\xE9m \xE9 um fator de
        risco, com homens afro-americanos tendo uma maior preval\xEAncia da doen\xE7a
        do que homens caucasianos.15 Estudos mostram que a preval\xEAncia da HPB \xE9
        de 14,8% em homens afro-americanos e 9,4% em homens caucasianos.16 \\nA hist\xF3ria
        familiar tamb\xE9m \xE9 um fator de risco, com homens que t\xEAm um hist\xF3rico
        familiar de HPB tendo uma maior probabilidade de desenvolver a doen\xE7a.17
        Estudos mostram que a preval\xEAncia da HPB \xE9 de 25,5% em homens com um
        hist\xF3rico familiar de HPB e 14,1% em homens sem um hist\xF3rico familiar
        de HPB.18 \\nO estilo de vida tamb\xE9m \xE9 um fator de risco, com homens
        que t\xEAm um estilo de vida sedent\xE1rio e obesos tendo uma maior probabilidade
        de desenvolver a doen\xE7a.19 Estudos mostram que a preval\xEAncia da HPB
        \xE9 de 20,5% em homens obesos e 12,3% em homens n\xE3o obesos.20 \\nO diagn\xF3stico
        da HPB \xE9 baseado em sintomas, exame f\xEDsico e exames complementares,
        como ultrassonografia e bi\xF3psia.21 Os sintomas mais comuns incluem dificuldade
        para iniciar a mic\xE7\xE3o, fluxo urin\xE1rio fraco, sensa\xE7\xE3o de esvaziamento
        incompleto da bexiga e frequ\xEAncia urin\xE1ria aumentada.22 \\nO exame f\xEDsico
        inclui a palpa\xE7\xE3o da pr\xF3stata, que pode ser aumentada em tamanho
        e ter uma consist\xEAncia firme.23 A ultrassonografia \xE9 um exame complementar
        importante, que pode avaliar o tamanho da pr\xF3stata e a presen\xE7a de n\xF3dulos
        ou les\xF5es.24 \\nA bi\xF3psia \xE9 um exame complementar que pode ser realizado
        em casos de suspeita de c\xE2ncer de pr\xF3stata.25 \\nO tratamento da HPB
        pode ser conservador ou cir\xFArgico, dependendo da gravidade dos sintomas
        e do impacto na qualidade de vida do paciente.26 O tratamento conservador
        inclui mudan\xE7as no estilo de vida, como perda de peso e exerc\xEDcios f\xEDsicos,
        e medicamentos, como alfa-bloqueadores e inibidores da 5-alfa-reductase.27
        \\nOs alfa-bloqueadores s\xE3o medicamentos que relaxam os m\xFAsculos da
        pr\xF3stata e da bexiga, melhorando o fluxo urin\xE1rio.28 Os inibidores da
        5-alfa-reductase s\xE3o medicamentos que reduzem o tamanho da pr\xF3stata,
        melhorando os sintomas.29 \\nO tratamento cir\xFArgico inclui procedimentos
        como a RTUP e a prostatectomia aberta.30 A RTUP \xE9 um procedimento minimamente
        invasivo que remove o tecido prost\xE1tico obstrutivo.31 A prostatectomia
        aberta \xE9 um procedimento cir\xFArgico que remove a pr\xF3stata inteira.32
        \\nA HPB \xE9 uma doen\xE7a comum e importante, que afeta a qualidade de vida
        de muitos homens. O diagn\xF3stico e o tratamento adequados s\xE3o fundamentais
        para melhorar a qualidade de vida dos pacientes acometidos. A idade, a ra\xE7a,
        a hist\xF3ria familiar e o estilo de vida s\xE3o fatores de risco importantes
        para a doen\xE7a. O tratamento pode ser conservador ou cir\xFArgico, dependendo
