      string: "{\"id\":\"cmpl-RYgfY91rJ28T4CUbNcF46XCD\",\"object\":\"text_completion\",\"created\":1746564684,\"model\":\"meta-llama/Llama-4-Maverick-17B-128E-Instruct-FP8\",\"choices\":[{\"index\":0,\"text\":\"perplasia
        prost\xE1tica benigna: revis\xE3o da literatura\\nvol.25\_n\xFAmero1 Fatores
        associados \xE0 ades\xE3o de gestantes ao tratamento da s\xEDfilis: revis\xE3o
