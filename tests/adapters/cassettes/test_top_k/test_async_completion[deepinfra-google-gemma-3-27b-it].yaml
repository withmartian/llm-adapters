        \u2013 Critical Step!**\\n\\nThis is where most of the improvement will come
        from.  You need to convert the MP4 to a Constant Frame Rate (CFR) MP4 *before*
        creating the GIF.  **Handbrake** is an excellent free tool for this.\\n\\n*
        **Download and Install Handbrake:**  [https://handbrake.fr/](https://handbrake.fr/)\\n\\n*
        **Handbrake Settings (for VFR to CFR):**\\n    1.  **Open your MP4 file in
