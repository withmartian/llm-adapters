        Factor (controls quality). Lower = better quality, larger file size.  23 is
        a good starting point.\\n* `-preset medium`: Encoding speed/quality trade-off.
        \ \\\"medium\\\" is a good balance.\\n* `-c:a copy`: Copy the audio stream
        without re-encoding.\\n\\n**5. GIF Creation (After VFR Correction)**\\n\\nNow
        that you have a CFR MP4, try *again* with your GIF creators:\\n\\n* **EZGif.com:**
        Use a frame rate of 10-20 fps.  Try different quantization methods (e.g.,
