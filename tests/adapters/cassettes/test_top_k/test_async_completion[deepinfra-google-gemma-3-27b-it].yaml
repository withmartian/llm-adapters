        better for recording directly.  We'll fix the VFR *before* GIF conversion.\\n*
        **Video Bitrate:**  **Increase the bitrate significantly.**  A higher bitrate
        means more information is preserved in the MP4, giving the GIF creator more
        data to work with.  Try **50 Mbps - 100 Mbps**. This might result in larger
        MP4 files, but it's necessary.\\n* **Encoder:**  H.264 is fine, but consider
        **NVENC H.264** (if you have an NVIDIA GPU) or **x264** (CPU) for potentially
        better quality.  NVENC often performs better with screen recordings.\\n* **FPS:**
        \ Keep it at **60 FPS**.  Don't lower this initially. We'll deal with it later
        if needed.\\n* **Keyframe Interval:** **Set this to 2.** This is crucial for
        editing and smooth GIF creation. (Defaults to 2 seconds, which is bad for
