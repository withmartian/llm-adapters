        code just freezes. I think the problem is that the code is taking too long
        to run but I don''t know how to optimize it. Please help.\n\nPosted\n\nUpdated
        1-Jul-23 23:01pm\n\nComments\n\njeron1 2-Jul-23 3:53am\n\nThe code is taking
        too long. For example, the outer loop (while (i < num)) will loop 600,851,475,142
