        % i == 0)\n        {\n            for (long long x = 1; x <= i; x++)\n            {\n                if
        (i % x == 0 && x != 1 && x != i)\n                {\n                    break;\n                }\n                else
        if (x == i)\n                {\n                    prime = i;\n                }\n            }\n        }\n        i++;\n    }\n    cout
        << prime << endl;\n    return 0;\n}\nWhat I have tried:\n\nI have tried to
