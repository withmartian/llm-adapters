        about 3.6e+18 seconds, which is way longer than the age of the universe. So
        you need a better algorithm.\n\n## 3 solutions\n\n## Solution 1\n\nThe code
        is taking too long. For example, the outer loop (while (i < num)) will loop
        600,851,475,142 times. Each time through the loop, the inner for loop (for
        (long long x = 1; x <= i; x++)) will loop up to i times. So even if i is 2,
        the inner loop runs 2 times, but when i is 600,851,475,142, the inner loop
