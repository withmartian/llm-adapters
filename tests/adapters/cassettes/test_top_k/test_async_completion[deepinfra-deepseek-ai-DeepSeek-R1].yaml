        All,\n\nI have a problem with the code below. The code is supposed to be a
        solution to problem 3 on Project Euler. I think the code is logically correct
        but whenever I run it, the program just freezes. I am new to programming and
        I can''t figure out what is wrong. Please help.\n\nThe problem is: The prime
        factors of 13195 are 5, 7, 13 and 29. What is the largest prime factor of
