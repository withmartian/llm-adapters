        have a mountain of rice more than high enough to cover the entire earth. That''s
        the power of the power of two.\n\nI learned another lesson in the power of
        the power of two when I was at university. In one of my first year programming
        assignments I was tasked with simulating a hospital ward. The ward had 20
        beds and patients who spent between 1 and 20 nights in the ward. The simulation
        ran for a given number of days (say 1000) and then printed the average occupancy
        of the ward. The simulation used a pseudo-random number generator to generate
        a number of patients each day (say between zero and five) and another random
        number generator to generate a random stay length (between one and twenty
        days) for each patient. The first approach I tried was to represent the ward
        as a boolean array - a bed was either occupied (true) or not (false). Each
        day I would iterate over the array decrementing each patient''s remaining
        stay length. When a stay length reached zero I would free the bed (set it
        to false). This worked, but it was a bit clunky. Then I had an idea. I realized
        I could represent the ward as an array of integers where each integer was
        a day number on which the bed would become free. For example, if the current
        day was day 42, and a patient was allocated to bed 12 who was going to stay
        for 3 nights then bed 12 would be set to day 45. Then each day I would compare
        the bed''s free-day with the current day. If it was less than or equal to
        the current day the bed was free. This avoided the clunky decrementing. That
        was my second lesson in the power of the power of two. The first approach
        was O(n) per bed per day. The second approach was O(1) per bed per day.\n\nI
        learned a third lesson in the power of the power of two when I was working
        as a C programmer. I needed to write a malloc (and free) for a performance
        critical application. The standard malloc (which uses a heap) was way too
        slow. I knew that malloc would be called very frequently for small amounts
        of memory (say 64 bytes or less) and less frequently for larger amounts. I
        decided to use power-of-two sized buckets. For example, if you wanted 20 bytes
        you''d get 32 bytes. If you wanted 33 bytes you''d get 64 bytes. This meant
        internal fragmentation - you might waste some memory - but it also meant that
        free could be O(1). All free had to do was place the memory back on the front
        of the appropriate free list. There was no need to coalesce adjacent free
        blocks or anything like that. That was my third lesson in the power of the
        power of two.\n\nI learned a fourth lesson in the power of the power of two
        when I was working as a C++ programmer. I was writing some code that needed
        to be very fast and I needed to work out if a number was a power of two. The
        first approach I tried was dividing by two repeatedly. This worked but was
        a bit clunky. Then I had an idea. I realized that in binary, a power of two
        is a one followed by zeros. For example, 2 is 10, 4 is 100, 8 is 1000, and
        so on. I also realized that a number one less than a power of two is a zero
        followed by ones. For example, 1 is 1, 3 is 11, 7 is 111, and so on. This
        meant that if I subtracted one from a power of two and did a bitwise AND with
        the original number I would get zero. For example, 4 & 3 is 100 & 011 which
        is 000. This meant I could write a function like this:\n\nbool is_power_of_two(unsigned
        n)\n{\n    return n != 0 && (n & (n - 1)) == 0;\n}\n\nThat was my fourth lesson
        in the power of the power of two.\n\nI learned a fifth lesson in the power
        of the power of two when I was reading about hash tables. A hash table is
        an array of buckets. When you insert a key-value pair into the hash table,
        the hash function maps the key to a bucket index. A good hash function distributes
        the keys evenly across the buckets. But what if you don''t know how many buckets
        you need in advance? One solution is to start with a small number of buckets
        and then resize the hash table when it gets too full. Resizing is expensive
        because you have to rehash all the keys. But if you make the number of buckets
