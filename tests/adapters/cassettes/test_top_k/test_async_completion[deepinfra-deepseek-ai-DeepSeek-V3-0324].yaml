        I''m Jon Jagger, director of software at Kosli. I built cyber-dojo, the place
        teams practice programming.\n\n### The power of the power of two\n\nI learned
        an early lesson in the power of the power of two when I was a small boy reading
        about the rice and the chessboard. In short, if you place one grain of rice
        on the first square of a chessboard, two on the second, four on the third,
