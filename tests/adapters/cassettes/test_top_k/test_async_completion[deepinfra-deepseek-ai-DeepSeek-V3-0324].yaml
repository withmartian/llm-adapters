        index. For example, if you have 8 buckets, you can do hash & 7 to get a bucket
        index between 0 and 7. This is much faster than using the modulo operator.
        That was my fifth lesson in the power of the power of two.\n\nI learned a
        sixth lesson in the power of the power of two when I was reading about memory
        management in operating systems. Operating systems often use a buddy memory
        allocation scheme. The idea is that memory is divided into blocks of size
