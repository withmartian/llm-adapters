        when kids are involved, there is always something that gets in the way and
        9 times out of 10 they end up fallen or hurt and you're then faced with a
        walk back through the mud carrying the bike.\\n\\nWell here comes the Health
        & Safety thing we have going on at the minute.\\n\\nWe have looked through
        some of what martial arts law does not do when they could be doing things
        for ourselves and have started to do it.\\n\\nOur first idea is to create
