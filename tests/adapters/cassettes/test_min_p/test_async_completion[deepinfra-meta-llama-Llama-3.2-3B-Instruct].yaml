        kung may mga mensahe sa bayan.\\n\\n ('A More Perfect Union', The Ivory Queens
        of Creation)\\n\\nBago pa mamulat ang isang malakas na suot, sa harapan natin
        ay pinaghihiwalay ang malasimang bahagyang sayal.\\n\\n ('A More Perfect Union',
        The Ivory Queens of Creation)\\n\\nSa katapang silang marahil ay hawak na
