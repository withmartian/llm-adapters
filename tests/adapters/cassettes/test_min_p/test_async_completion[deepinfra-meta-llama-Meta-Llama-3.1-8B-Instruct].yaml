        \xFCtk\xF6z\xE9s, j\xE1t\xE9k, b\xE1tors\xE1g\\n\\nIfi, fi\xFA, meg\xE9rz\xE9sek,
        titkok, filmn\xE9z\xE9s, l\xF3\\n\\nhasi, mikrofon, n\u0151k, dajka, nyelv\\n\\nsz\u0171z,
        \xF6ngyilkoss\xE1g, szem\xF6ld\xF6k\\n\\nutols\xF3 sz\xF3, megcs\xF3kol\xE1s,
