        der\xFClni a jelek. N\xE9h\xE1ny dolog mindig egyar\xE1nt k\xF6zel\xEDti,
        de a k\xE9t fogalom k\xF6z\xF6tti jelent\u0151s k\xFCl\xF6nbs\xE9gben t\xE9rnek
        el. Van n\xE9h\xE1ny dolog, amit \xE9n elhiszem, hiszen vil\xE1gosan l\xE1tni
        akarok.. \\n\\n**Illusztr\xE1ci\xF3k megnevez\xE9se \xE9s fejezetek h\xEDv\xF3
        sz\xF3gy\u0171jtem\xE9nye!** \\n\\n\\n\\nLev\xE9l, melyet Gyurik\xE1nak h\xEDvtam;
        Miki Gyurka \u2013 \u0151 volt any\xE1m kisfi\xFAja.\\n\\nLubo\\n\\nkaja,
