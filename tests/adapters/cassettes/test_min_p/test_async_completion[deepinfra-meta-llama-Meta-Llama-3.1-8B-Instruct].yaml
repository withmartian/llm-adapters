        \xE9s egy\xFAttal vesz\xE9lyesnek \xE9rzem magam.. \\n\\nA k\xE9t \xE9vvel
        k\xE9s\u0151bbi fi\xFA szem\xE9ben ki fog t\u0171nni, ha tizen\xF6t \xE9ves
        lenne. \\nA feln\u0151tt emberi l\xE9nynek megvan a leghelyesebb \xE9rz\xE9se.
        Csak fel\xFClet\xE9n bukkan fel. Annak \xE9rdek\xE9ben, hogy nem fogja \xE9lni
        t\xFAl, de nem is fogj\xE1k el\xE9rni..\\n\\nAk\xE1r egy r\xE9m\xE1lom, ak\xE1r
        \xE1lom, de egyszer\u0171en nem, amit az ember akar, amikor legk\xE9s\u0151bb
        egyetlen pillanatot t\xF6lteni a r\xE9m\xE1lomban, tizen\xF6t \xE9ves kor\xE1ban.
        Ha tal\xE1n nem kellen\xE9k el valaki m\xE1s, vagy ak\xE1r a feles\xE9gem.
        Nem akartam ilyen hirtelen meg\xE9rkezni a feln\u0151tt \xE9letb\u0151l, hogy
        alacsony falakkal leszakad\xE1s t\xF6rt\xE9njen rajtam. Az any\xE1m, mert
        amikor azt\xE1n r\xE1hangol\xF3dik, nagyon elviselhetetlen, b\xE1nt\xF3  nyomaszt\xE1sokat
        gyakorol  r\xE1m, gyakran nem lesz szabad \xE9s nem lesz el\xE9g az, amit
        \xE9n megtettem, akkor nem lesznek k\xF6nnyen t\xFCntet\u0151ek. \xC9s mik\xF6zben
