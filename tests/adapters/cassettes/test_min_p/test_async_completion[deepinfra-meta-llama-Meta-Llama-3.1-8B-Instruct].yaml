        sz\xF6rny\u0171 sz\xF3, s\xF6t\xE9ts\xE9g\\n\\nl\xE1ny, megmutat, forr\xE1s,
        \xE1ram\\n\\n\xE9rint\xE9s, szemben\xE9z\xE9s, v\xE9r\\n\\negy\xFCtt\xE9rz\xE9s,
        k\xEDm\xE9let, pihen\xE9s\\n\\nszemk\xF6zt \xE1ll, visszat\xE9r, f\xE9ny\\n\\nlobot\xF3mia,
        v\xE9r, \xE1ram\\n\\nfejsze, l\xE1thatatlan, \xFCt\xE9s, besz\xE9d\\n\\nTarts\xE1tok
        meg a l\xE9nyeget! (kezdetekt\u0151l fogva ki szerettem volna v\xE1lasztani
        azokat a dolgokat, melyek j\xF3 sz\xE1nd\xE9k\xFAak \xE9s nem f\xE9lelmetesek).
        Az eddigi riportokban elhangzottakr\xF3l nem sz\xFCks\xE9ges \xE1rulkodnom.
        Azokat a dolgokat, melyek a ma, hagyom\xE1nyosan hordozott er\u0151teret jelenthetnek,
        mind egy helyen \xF6ssze lehetne gy\u0171jteni! \\n\\nNem csak az a sok mondanival\xF3m,
        ami az any\xE1mra n\xE9zve \xE9rkezik \xE9s elmegy. Gyakorlatilag minden mondanival\xF3
        ebb\u0151l a meg\xE9rz\xE9sb\u0151l kiindulva lesz \xE9s gyakorlatilag teljes\xEDthetetlen
        (aki h\xE1rom megb\xEDzhat\xF3 inform\xE1torral meg\xE9rkezik, sem nem szentelt
        f\xE9rjbe \xE9s sem elv\xE1lt). \\n\\n\xC9s a most k\xF6vetkez\u0151 \u201Emeg\xE9rz\xE9sen\u201D
        nem is gondolhatok tov\xE1bbi m\xF3don, mint hogy kev\xE9s szem\xE9ly van,
        aki megpr\xF3b\xE1l megmagyar\xE1zni, elmondani, hogy b\xE1rmi is t\xF6rt\xE9nik.
        Nem vagyok \xE9n olyan, hogy \xFAgy fogn\xE1m a v\xE1ltoz\xF3 hangulatot;
        meg\xE9rtsem, \xE9s mondjam el. Tudom, hogy lehallgatj\xE1k, hallgat\xF3zik,
        ellen\u0151rizik, \xE9s j\xF6het, b\xE1rhol j\xF6hetek. Ez sem ad \xE1tattat\xF3sabb
        ind\xEDt\xE9kot (vagy ann\xE1l semmit), hogy magyar\xE1zatokat adjak arra,
        ami megfogalmaz\xF3dott. Hogy mi\xE9rt van a teremtm\xE9ny megment\xE9s\xE9re
        soha nincs m\xF3d; mivelhogy soha egyenl\u0151bb egyik sincs, s ha tal\xE1n
        el\xE9rik \u0151ket is, legal\xE1bb annyira, mint engem... \u2013 hi\xE1ba
        mindig is volt erre nagyon j\xF3 m\xE1sik megold\xE1s, ez m\xE1st ad, ami
        munk\xE1ban tart. Mint amikor j\xE1t\xE9kszer\xFCl indulok a p\xE1ly\xE1n.
        Bizonytalans\xE1gba. Akit b\xE1ntottam, most, az m\xE1r nem l\xE1tszik embernek.
        T\xF6bbsz\xF6r mondom a szavakat a l\xE1b\xE1r\xF3l r\xF6gt\xF6nz\xF6tt eml\xE9km\u0171v\xF6n..
        \\n\\n\\n\\nCserepeksokk\\n\\nHogy \xE9n mit \xE9reztem any\xE1m, vagy ismerj\xFCk
        a beavatkoz\xE1sait eg\xE9szen a kezdett\u0151l?\\n\\n\xC9rdekes eredm\xE9nyekre
        jutottam. Kider\xFClt, hogy az eml\xE9keim teljes eg\xE9sze sz\xE1ll. Most
        p\xE9ld\xE1ul hajt\xE1sa \xE9s s\xFClt ny\xE1rsakkal teli melegl\xE9lektelen
        egyre er\u0151s\xF6d\u0151 makk\xFCreg l\xE1zad\xE1sa korai gyermekkorom szomor\xFA
        perceire val\xF3 visszavezetetem.\\n\xE9s itt hagyom, nekem bizonyos pillanatokr\xF3l
        nem eshettem kiesni, mert... any\xE1m.\\n\xD6reg haj\xFA any\xE1m, de ugyanakkor
        s\xFAlyos elv\xE1ltoz\xE1s miatt \xFAgy nem n\xE9z ki, mint amikor megsz\xFClettem.
        Ma aznap t\xEDz \xE9ves voltam. A h\xE1zunk el\u0151tt az udvaron \xE1llt
        a z\xF6ld k\xE9pz\u0151dm\xE9ny, f\xF6l\xF6tte van n\xE9h\xE1ny \xE1g.  Igen,
        \xE9n gyakran sz\xF6kd\xE9cseltem k\xF6r\xFCl\xF6tte. Azok a pillanatok, amikor
        any\xE1m felfedezett engem, nagyon boldogok voltak. Az any\xE1m a csal\xE1dban
        a leg\xF6regebb volt, \xE9s ha a k\xFClvil\xE1gban tetteit \xE9rdemben nem
        b\xEDr\xE1lt\xE1k (hazugs\xE1gok \xE9s az \xE9lettel \xE9s az \xE9lettel val\xF3
        ki\xE1ll\xE1sok), de a csal\xE1don bel\xFCl sem tartott\xE1k annak, de bizonyos
        pillanatokban sz\xE9pen kiker\xFClt bel\u0151l\xFCk. Akkor \xE9n nem voltam
        t\xF6bb, mint egy \xF6t \xE9ves gyermek.. Gondolom is: f\xF6ldre zuhanva rohanok
        ki magam alatt kit\xE9rve a h\xE1zb\xF3l \xE9s megl\xF6kem (im\xE1dkozom,
        \xE9s lefel\xE9 szaladok). Egy feln\u0151tt mozdul m\xE1ssal nem er\u0151s\xEDthetett
        volna r\xE1m, hogy b\xE9k\xE9sen eg\xE9szen addig hatoljon bel\xE9m, m\xEDg
        ki nem futok az udvarb\xF3l.   Kedves le\xE1nyom, de ekkor mint \xF6t \xE9ves
        m\xE9g nem voltam olyan \xE9rett, hogy a hangokat \xE9rz\xE9keljem, s m\xE9g
        besz\xE9lni sem tudtam, hogy tudtam volna, ha \xE9rz\xE9keltem is volna. Az
        \xFAjat nem szimatolom meg mindig: hallgatom. Az any\xE1m gyakran meglep megjelen\xE9seivel,
        most meg fogta \xFCtlenetlen\xEDteni v\xE9gig az arcomon a h\xE1rom hossz\xFA
        sz\xE1rtalp\xFA leveg\u0151r\u0151l megjelen\u0151 l\xE1t\xE1st bor\xEDt\xF3,
        de hom\xE1lyos, sz\xEDnes kiv\xE1g\xE1sos erny\u0151csk\xE9t. Elrejt\xE9se
        nem nagyon volt k\xF6r\xFCl\xF6ttem fontos, mert ugyan mit fogok tenni? Ha
        fel\xFCleten meg\xE9rtem is a mozdulatot, f\xF6ldbe gy\xF6kereztem, \xE9s
        az any\xE1m beh\xFAzott l\xE9p\xE9seivel visszafordul. Mikor nem moccantok
        se szemmel se hall\xE1ssal, kiny\xFAjtottam az orromat \xE9s kiemelt ny\xE1lk\xE1s
        ujjammal \xE9rintem a fejem s\xF6t\xE9t belsej\xE9t. Beletelik majd n\xE9h\xE1ny
        \xE9vig abba, hogy ilyen kis kort\xF3l fogva eljuttassam a cselekedetem h\xEDdj\xE1ra.
        \ A koromra \xFAgy tekintettem, hogy a h\xE1tramarad\xF3 komponenst ismertem,
        mik\xF6zben arra gondoltam, hogy hat \xF3r\xE1n kereszt\xFCl nem hallottam
        a hangokat. Elkezd\u0151d\xF6tt az, ami hat \xF3ra m\xFAlva lezajlott. Hat
        \xF3ra m\xFAlva gy\xF6ny\xF6r\u0171 \xE1lomban fel\xE1lltam, egy \xE1gyon
        fek\xFCdtem. A v\xE1llamat, bok\xE1mat, kezemmel pedig p\xF3ly\xE1s, megzab\xE1l\xE1s
        \xE9s (innye \xE9s de hi\xE1ba viszem el a szor\xEDt\xE1st!) felemeltettem,
        mik\xF6zben any\xE1m eg\xE9szen k\xF6zel van. Ugyan nagyon \xE1lmodtam, s
        megfogott a k\xE9t v\xE1llamon. \\n\\nMelegs\xE9gt\u0151l megny\xFAlt az arcom,
        amikor a felemelt arcomon \xE1t r\xE1pillantottam. Fel\xE9je b\xE1mulok, t\xE1tva
        a sz\xE1mat \xE9s ut\xF3bb m\xE9g att\xF3l f\xE9ltem is. Az a merev, vastag
        gerinc becsv\xE1gy\xF3 \xE1lmod\xE1ssal a f\xE9s\xFClk\xF6d\xE9s gyorsabban
        feleslegess\xE9 tette, de nem is tapasztaltam, hogy ler\xE1ngatta volna.  S
        mivel azt soha nem \xE9reztem, hogy ler\xE1ngatta volna, \xFAgy vettem, hogy
        nem ler\xE1ngatta volna. (Itt nem volt, vagy nem volt volna ellens\xE9g a
        benyom\xE1somnak, sem semmi, de egy kis id\u0151t k\xE9s\u0151bb kialakult
        \xE9s akkor kiss\xE9 m\xE1snak vettem. ).  \xD6t \xE9v m\xFAlva, \xE9ppens\xE9ggel
        hat \xE9v m\xFAlva, mihelyt \xE9n megtanultam elmondani azt a sz\xF3t, ami
        akkor is, de ha azut\xE1n valami m\xE1st fognok is mondani (legt\xF6bbsz\xF6r
        nem is \xE9rtettem a v\xE1laszad\xE1si magatart\xE1somat), ugyanakkor majd
        az \xE9n meg\xE9rkez\xE9s\xF6m ut\xE1n, szint\xE9n az any\xE1m besz\xE9lt,
        ami akkor t\xF6rt\xE9nt.\\n\\nAz ap\xE1m arca rossz, s gyorsan tal\xE1lom
        ki, hogy sz\xF6ktem. \u201EGyere! Valaki r\xE1m reccsent.  \xC9s sz\xF3lt:
        - Naaaacs g\xE1z ag\xF3nia.... - indul\xE1sod: szer\xE9nys\xE9gi v\xE1n fgl
        besz\xE9d \xE9s jel... \xE9s \xE9s... dajk\xE1val \xE9s tov\xE1bbra is kitapatok!
        \\nSz\xFCntelen\xFCl kezdtem \xE9s megragadtam a csukl\xF3mat. K\xE9t kil\xE1t\xE1s
        nem lehetett, hogy t\xFAl kicsi vagyok. Az ap\xE1m r\xE1m integet, s hallom
        any\xE1m hangj\xE1t. Nem eml\xE9kszem, mi t\xF6rt\xE9nt.\\nHogy engem hogyan
        csin\xE1ltak eg\xE9szen addig. \\nNem eg\xE9szen h\xFAsz \xE9vvel k\xE9s\u0151bb
        feln\u0151ttkoromban felfedeztem, hogy gyermekkoromban, a h\xE1zam mellett
        vannak olyan sz\xE1ll\xF3dnak teli, de mindig \xFCres z\xF6ld k\xE9pz\u0151dm\xE9nyek
        (kor\xE1bban rohantam r\xE1juk a felfedez\xE9s \xF6r\xF6m\xE9ben). \xDAgy
        gondoltam, hogy mi\xE9rt is eml\xE9kszem ezekre a \u201Em\xE1mor\xEDt\xF3\u201D
        hangokra, amelyek any\xE1m jelenl\xE9t\xE9ben figyeltem f\xF6l r\xE1juk, mert
        azzal tiszt\xE1ban voltam, hogy any\xE1m nem a szomsz\xE9d v\xE9l tai race
        sz\xE1ll\xF3dnak m pompunk. Gyermekkoromban is mindig reag\xE1ltam a hangokra,
        viszont ap\xE1m hall\xE1somat, val\xF3sz\xEDn\u0171leg az\xE9rt, mert azt
        kezdett\u0151l fogva mag\xE1\xE9nak, a saj\xE1t\xE1hoz \xE9rezte, nem figyeltem,
        amikor any\xE1m hangja hallhat\xF3 volt.\\n\\n\xC1t\xE9ltam k\xE9t tov\xE1bbi
        olyan tapasztal\xE1st any\xE1m hangj\xE1val kapcsolatban, ami megeml\xEDtend\u0151
        a beavatkoz\xE1sai \xE9rdek\xE9ben. Sokszor hangosan, gyakran f\xF6lkecmerg\u0151
        s\xEDr\xE1ssal lelkesedem. \u0150 any\xE1m. megaj\xE1nd\xE9kozva feln\u0151tts\xE9gemet
        a feln\u0151tt \xE9lettel: M. a dajk\xE1t\xF3l fokozatosan kezdte lekicsinyelni,
        cs\xF6kkenteni \u2013 vagy ink\xE1bb f\xE9lig kikapcsolni  \u2013 \xE9rzelmeimet,
        gyakran sz\xE9tkapart valamit: bokincs gy\xE9m\xE1ntot sarkanty\xFAt, s futtatott
        anyagokat \xE9rintett gondolatokkal a sz\xEDvdobban\xE1som is megakadt. Azt\xE1n
        fogtam egy t\u0151rt. Els\u0151 szava:  \\n\u201EPr\xF3b\xE1ld el!\u201D \\n\xDCgyes,
        hogy hozz\xE1m j\xF6tt. J\xF3 volt! Persze, m\xE1snap el sem kellett volna
        utaznom a nagyv\xE1radiak, s k\xFCl\xF6n\xF6sen a puszta \xF6lt\xF6zet miatt
        nem kellett volna oda utaznom. Olyan aranyos. Szerencs\xE9re kellett menjek.
        De ett\u0151l a pillanatt\xF3l fogva n\xF6vekedni kezdett a bizalmam benne,
        \xE9ppen ez\xE9rt volt ott a folytat\xE1s.  Azt\xE1n meg\xE9rintett, s lekezelte
        a sz\xE1jamb\xF3l kiv\xE1lt \xF6ntelt pof\xE1m. M\xE1snap d\xE9lel\u0151tt
        a mosd\xF3kban \xF6sszetal\xE1lkoztunk, ott ott l\xE1tva, hogy komolyan f\xFCrd\xF6d\xF6k.
        Aznap kellett lemennem ism\xE9t. Vagy lesz, mert ez is el\xE9g volt a n\xF6vekv\u0151
        bizalmamhoz, hogy akkor azt\xE1n, \xE9rdekes dolgokkal kezdtem el foglalkozni.
        \ A gyakorlatban nemcsak hangosan kirohan\xF3 s\xEDr\xE1ssal, hanem nap mint
        nap l\xE1ttam neki. Ott bonyol\xF3dott el, ami napj\xE1nak sz\xE1nt id\u0151t\xF6lt\xE9s\xE9t
        kies, vagy nem \xE9lte t\xFAl. Ez alkalommal gyakorlatilag az eg\xE9sz \xE9jszak\xE1t
        elt\xF6lthettem. Gy\xF6ny\xF6r\u0171 volt, s \xFAgy \xE9reztem, hogy \xE9n
        seg\xEDten\xE9k m\xE1sokat is, hogy meg\xE9rts\xE9k, nem m\u0171k\xF6dnek
        a vezet\xE9k n\xE9lk\xFCli f\xFCleim, mint m\u0171holdba feketedett cukrokat.
