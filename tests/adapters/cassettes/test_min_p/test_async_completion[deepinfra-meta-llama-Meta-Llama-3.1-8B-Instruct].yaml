        \xE9s nagyon gyenge fi\xFA vagyok \xE9s nincs is felel\u0151ss\xE9gem sem,
        ahogy (az igazs\xE1g szerint sokkal kor\xE1bban el lehetett volna \xE9rni
        az eredm\xE9nyekben \xFAgy, ha a v\xE1llamat deregly\xE9v\xE9 alak\xEDtom,
        hogy sok \xE9vvel kor\xE1bban feln\u0151tts\xE9gbe kezdjek, de ennek kellett
        v\xE9g\xFCl \xFAgy t\xF6rt\xE9nnie).  A sz\xEDvemet nagyon megviseli a r\xE1oson\xF3
        \u201Esokkot fokoz\xF3 t\xE9ny\u201D, ha \xFAgy \xE9rzem: \xE9lnem kell a
        k\xE9ts\xE9gbees\xE9sben, csod\xE1latos k\xE9t vil\xE1g k\xF6z\xF6tt, visszafele
