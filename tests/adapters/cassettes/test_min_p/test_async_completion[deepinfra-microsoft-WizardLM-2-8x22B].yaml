        (pWdog->base.bEnabled)\n        {\n            wdogReset(pWdog);\n        }\n    }\n}\n\n\n/*-------------------------------------------------------------------------\n|   Function:     tutGetMediaInfo\n|\n|   Description:    Returns
        information about the media supported by\n|                      this driver.\n|\n|   Parameters:    SiMediaInfo_t
        *pInfo - Pointer to media information\n|                      structure to
