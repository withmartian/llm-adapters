        = 0; /* Reset WDOG count */\n    pTut->nWdogProfiles = 0; /* Reset WDOG profile
        count */\n}\n\n\n/*----------------------------------------------------------------------\n|   wdogTimerISR\n+---------------------------------------------------------------------*/\nvoid
        wdogTimerISR(tut_wdog_t *pTut, int nChannel)\n{\n    int nCheck;\n    unsigned
        int nMask;\n\n    if (pTut->b68360)\n    {\n        /* Ensure that the interrupt
        source is a WDOG! */\n        nMask = pTut->pCcmRegs->INT_RAW_STATUS;\n        if
