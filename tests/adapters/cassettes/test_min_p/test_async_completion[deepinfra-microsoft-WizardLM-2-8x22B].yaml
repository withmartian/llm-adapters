        and profile data.\n|   Return Value: None.\n+-------------------------------------------------------------------------*/\nvoid
        tutProfileLoad(SiMediaEntry *pMe)\n{\n#ifdef MPALIB_SUPPORT_ASYNC_PROFILE\n    wdogAsyncLoad(pMe,
