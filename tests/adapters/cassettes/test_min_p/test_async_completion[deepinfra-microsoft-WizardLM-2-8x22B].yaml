        \"si_toolchain.h\"\n\nextern void wdogTimerISR(tut_wdog_t *pTut, int nChannel);\n\n/*----------------------------------------------------------------------\n|       global
        data\n+---------------------------------------------------------------------*/\ntut_wdog_t
        gTutWdog;\n\n\n/*----------------------------------------------------------------------\n|       ISR
        callback\n+---------------------------------------------------------------------*/\nvoid
        wdog_timer_isr(void)\n{\n    int nChannel = (SiApiRead(&gTutWdog, MPA_CORE_BASEADDR
        + MPA_CORE_RTI_STS_OFFSET) >> 24);\n\n    MPADEBUG(3, \"WDOG timer ISR called,
        channel = %d\\n\", nChannel);\n\n    if (nChannel >= gTutWdog.nWdogCount)\n    {\n        MPADEBUG(1,
        \"Invalid watchdog timer interrupt ID %d\\n\", nChannel);\n        return;\n    }\n\n    wdogTimerISR(&gTutWdog,
        nChannel);\n    __call_isr_clock_enable();\n}\n\n\n/*-------------------------------------------------------------------------\n|   Function:     tutRegister\n|\n|   Description:    Registers
        the driver with the system.\n|\n|   Parameters:    SiDriverInfo_t *pInfo -
        Pointer to driver information\n|                      passed from the system.\n|   Return
        Value: None.\n+-------------------------------------------------------------------------*/\nvoid
        tutRegister(SiDriverInfo_t *pInfo)\n{\n    gTutWdog.siApi.pRegs = pInfo->pRegs;\n    gTutWdog.siApi.nRegsSize
        = pInfo->nRegsSize;\n    gTutWdog.siApi.pDeviceIdentity = pInfo->pDeviceIdentity;\n    gTutWdog.siApi.nDeviceIdentitySize
        = pInfo->nDeviceIdentitySize;\n\n    /* Hook the driver up to the interrupt
        system */\n    SiDevRegisterIntSource(pInfo->pDevReg, MPA_CORE_BASEADDR +
        MPA_CORE_RTI_STS_OFFSET, 0xFF, wdog_timer_isr);\n\n    /* Initialise the WDOG
        driver */\n    wdogInit(&gTutWdog);\n}\n\n\n/*-------------------------------------------------------------------------\n|   Function:     tutDeRegister\n|\n|   Description:    De-registers
        the driver with the system.\n|\n|   Parameters:    SiDriverInfo_t *pInfo -
        Pointer to driver information\n|                      passed from the system.\n|   Return
        Value: None.\n+-------------------------------------------------------------------------*/\nvoid
        tutDeRegister(SiDriverInfo_t *pInfo)\n{\n    /* De-initialise the WDOG driver
        */\n    wdogDeinit(&gTutWdog);\n}\n\n\n/*-------------------------------------------------------------------------\n|   Function:     tutEarlyInit\n|\n|   Description:    Early
