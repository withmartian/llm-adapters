        NULL)\n        {\n            wdogAsyncLoad(pMe, pTut);\n        }\n    }\n#endif\n}\n\n\n/*----------------------------------------------------------------------\n|   wdogDeinit\n+---------------------------------------------------------------------*/\nvoid
        wdogDeinit(tut_wdog_t *pTut)\n{\n    int i;\n\n    /* FIXME: Shouldn''t we
        remove the ISR and disable the interrupt line? */\n\n    /* Close any loaded
