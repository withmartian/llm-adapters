        /* TUT_WDOG_C */\n\n\n+++++ Source/MykGw/tut_wdog.h\n/*----------------------------------------------------------------------\n|       includes\n+---------------------------------------------------------------------*/\n#include
        \"mpa.h\"\n\n#if (MPA_INCLUDE_WDOG == 1)\n\n/*----------------------------------------------------------------------\n|       forward
        declarations\n+---------------------------------------------------------------------*/\nstruct
        tut_wdog_t;\nstruct watchdog_t;\n\n/*----------------------------------------------------------------------\n|       typedefs\n+---------------------------------------------------------------------*/\ntypedef
