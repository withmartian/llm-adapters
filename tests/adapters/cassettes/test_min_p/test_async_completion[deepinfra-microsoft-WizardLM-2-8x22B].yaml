        = (1 << (16 + nChannel));\n    }\n    else\n    {\n        SiApiPoll(pTut,
        nCheck);\n    }\n\n    /* Call the user ISR */\n    if (pTut->ppWdog[nCheck]->isr.pCallback
        != NULL)\n    {\n        pTut->ppWdog[nCheck]->isr.pCallback(pTut->ppWdog[nCheck]->isr.pCallbackArg);\n    }\n}\n\n\n/*----------------------------------------------------------------------\n|   wdogReset\n+---------------------------------------------------------------------*/\nvoid
        wdogReset(watchdog_t *pWdog)\n{\n    if (!pWdog->base.bEnabled)\n    {\n        MPADEBUG(1,
