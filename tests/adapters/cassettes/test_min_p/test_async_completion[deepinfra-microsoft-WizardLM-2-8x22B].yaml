        = nReloadValue;\n    pWdog->base.eMpaStatus = MPA_STATUS_OK;\n}\n\n\n/*----------------------------------------------------------------------\n|   wdogEnable\n+---------------------------------------------------------------------*/\nvoid
        wdogEnable(watchdog_t *pWdog)\n{\n    tut_wdog_t *pTut = pWdog->pTut;\n    unsigned
        int nValue;\n\n    if (pWdog->base.bEnabled)\n    {\n        MPADEBUG(1, \"__FUNCTION__:
        WDOG already enabled\\n\");\n        pWdog->base.eMpaStatus = MPA_STATUS_INVALID_OPERATION;\n        return;\n    }\n\n    if
