        with the same molecular formula different substances?\\n* How can you distinguish
        between structural isomers of a hydrocarbon?\\n* How do you explain the existence
        of different substances with the same empirical formula?\\n* What is the difference
        between a _structural formula_ and a _molecular formula_?\\n* How do you determine
        the molecular formula of a substance from the empirical formula?\\n* What
        is the formula for the empirical formula of a molecule with the following
        molecular formula: C\\\\({}_{5}\\\\)H\\\\({}_{4}\\\\)?\\n* What is the molecular
        formula of a compound with an empirical formula of C\\\\({}_{4}\\\\)H\\\\({}_{6}\\\\)?\\n*
        A hydrocarbon with the empirical formula CH\\\\({}_{4}\\\\) has a molecular
