        Wizard Interface\nOnce the interface has been loaded, the main TECH Wizard
        form will be displayed. This form is used to control the entire design process.
        Each of the buttons located on this form will be discussed below.\n### Creating
        a New Design\nTo start a new design, click on the _New Design_ button. This
        will display the New Design Wizard form shown below.\nThe New Design Wizard
